name: deploy

on:
  push:
    branches: [main]

# Two pushes in quick succession would otherwise run cdk deploy against the same
# stack at once: the second fails on UPDATE_IN_PROGRESS, and whichever finishes
# last decides what is deployed. Queued rather than cancelled, because a
# cancelled deploy can leave the stack mid-update.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs. A tag is a mutable pointer, so `@v7` means
# "whatever that repository labels v7 today"; moving one is a published attack
# against Actions users. The trailing comment is the only thing naming a version,
# so check it against the SHA rather than trusting it. Resolved from the GitHub
# API, and these majors run on Node 24: the ones before them are deprecated and
# the runner forces them onto 24 anyway.
jobs:
  # Deliberately holds no id-token permission. Installing dependencies and
  # running eslint, tsc and vitest executes a large amount of third-party code,
  # and any step in a job that may mint an OIDC token can assume the deploy role
  # directly - ordering the AWS step last would not contain it. Splitting the
  # jobs keeps that surface away from the token entirely.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # The same check the pre-commit hook runs. CI repeats it because the hook
      # is local and --no-verify skips it.
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
          # Off by default. Without it the account id reaches this log inside the
          # stack ARN and the topic ARN, which no CfnOutput change would suppress.
          mask-aws-account-id: true

      # The API URL still reaches this log through the stack outputs, and a
      # repository's run logs become readable by everyone when it is made public,
      # including runs recorded while it was private. Masking is not retroactive.
      # Delete the historical runs before changing visibility, or close the open
      # write route first.
      # The subject claim GitHub actually sends, which the trust policy must match
      # exactly. Built from the numeric ids rather than the names because GitHub
      # issues immutable subjects; `gh api repos/<owner>/<repo>/actions/oidc/
      # customization/sub` reports the authoritative value. The ids arrive as env
      # rather than inside the script, so nothing from the event is interpolated
      # into a shell command.
      - id: sub
        run: echo "prefix=repo:${GITHUB_REPOSITORY_OWNER}@${OWNER_ID}/${GITHUB_REPOSITORY#*/}@${REPO_ID}" >> "$GITHUB_OUTPUT"
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          REPO_ID: ${{ github.repository_id }}

      - run: npx cdk deploy --require-approval never
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_SUB_PREFIX: ${{ steps.sub.outputs.prefix }}
