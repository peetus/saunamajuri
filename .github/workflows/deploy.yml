name: deploy

on:
  push:
    branches: [main]

# Two pushes in quick succession would otherwise run cdk deploy against the same
# stack at once: the second fails on UPDATE_IN_PROGRESS, and whichever finishes
# last decides what is deployed. Queued rather than cancelled, because a
# cancelled deploy can leave the stack mid-update.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs. A tag is a mutable pointer, so `@v4` means
# "whatever that repository labels v4 today"; moving one is a published attack
# against Actions users. Resolved from the GitHub API on 2026-09-23.
jobs:
  # Deliberately holds no id-token permission. Installing dependencies and
  # running eslint, tsc and vitest executes a large amount of third-party code,
  # and any step in a job that may mint an OIDC token can assume the deploy role
  # directly - ordering the AWS step last would not contain it. Splitting the
  # jobs keeps that surface away from the token entirely.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # The same check the pre-commit hook runs. CI repeats it because the hook
      # is local and --no-verify skips it.
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
          # Off by default. Without it the account id reaches this log inside the
          # stack ARN and the topic ARN, which no CfnOutput change would suppress.
          mask-aws-account-id: true

      # The API URL still reaches this log through the stack outputs, and a
      # repository's run logs become readable by everyone when it is made public,
      # including runs recorded while it was private. Masking is not retroactive.
      # Delete the historical runs before changing visibility, or close the open
      # write route first.
      - run: npx cdk deploy --require-approval never
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_REPO: ${{ github.repository }}
